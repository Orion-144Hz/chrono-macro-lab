# =============================================================================
# Chrono-Macro-Lab — yapılandırma
# =============================================================================
# Bu dosya, sistemin TEK tarih kaynağıdır. Cutoff hiçbir zaman koda gömülmez.
# Aynı kod tabanı farklı cutoff değerleriyle (2010 / 2013 / 2016 ...) çalışabilir.
#
# GELİŞTİRİCİ NOTU: Bu dosyaya cutoff sonrası döneme ait gerçek bilgi, gerçek sonuç
# veya yorum yazılmaz. Yalnızca parametre ve kural tanımı bulunur.
# =============================================================================

project:
  name: chrono-macro-lab
  schema_version: 1
  # Aşama 0 = yalnızca iskelet. Veri hattı devreye alındığında artırılır.
  stage: 0
  description: >-
    Zamansal olarak izole edilmiş bir araştırma sistemi: cutoff anında erişilebilir
    bilgiden dünya durumu kurar, cutoff sonrası dönem için ölçülebilir hipotez ve
    olasılıksal tahmin üretir. Yatırım tavsiyesi veya canlı işlem sistemi değildir.

# -----------------------------------------------------------------------------
# DENEY KOŞUSU (RUN)
# -----------------------------------------------------------------------------
run:
  # Etkin cutoff. Bir koşu TEK cutoff ile tanımlanır: "şimdi" bu andır.
  # Bu tarihten SONRA kamuya açılmış hiçbir kayıt havuza giremez.
  cutoff_date: "2010-12-31"

  # Farklı dönemleri tekrar edebilmek için hazır profiller.
  # Kullanım: config'teki cutoff_date değerini bu anahtarlardan biriyle değiştir
  # (ör. `--cutoff-profile c2013`) veya CLI ile cutoff_date'i ez.
  cutoff_profiles:
    c2010: "2010-12-31"
    c2013: "2013-12-31"
    c2016: "2016-12-31"

  # Koşu kimliği dosya/klasör adlarında kullanılır. Tahmin ve değerlendirme
  # çıktıları bu kimlikle ayrıştırılır; farklı cutoff koşuları karışmaz.
  run_id_template: "cutoff_{cutoff_date}"

  # Tahmin ufku: cutoff'tan sonra kaç günlük dönem "sınav" sayılır.
  forecast_horizon_days: 365

  # Tahminlerin çözüleceği (gerçekleşmeyle karşılaştırılacağı) en erken an;
  # backtest takviminin hesaplanmasında kullanılır.
  evaluation_start_offset_days: 1

  # Zaman dilimi ve biçim: tüm zaman alanları UTC ve ISO-8601 olarak saklanır.
  timezone: "UTC"
  datetime_format: "%Y-%m-%dT%H:%M:%SZ"
  date_only_format: "%Y-%m-%d"

# -----------------------------------------------------------------------------
# ZAMAN SEMANTİĞİ (en kritik bölüm)
# -----------------------------------------------------------------------------
time_semantics:
  # Her kayıtta bulunması ZORUNLU alanlar.
  required_fields:
    - event_time      # olayın gerçekleştiği an (bağlam)
    - available_time  # bilginin kamuya açıldığı an (asıl erişim sınırı)
    - source_date     # kaynağın kendi tarih damgası (yardımcı kontrol)

  # Filtreleme esas olarak available_time üzerinden yapılır.
  primary_filter_field: "available_time"
  secondary_filter_fields:
    - "source_date"
    - "event_time"

  # Kural: bir kayıt havuza girebilmesi için TÜM ikincil alanların da cutoff'tan
  # büyük olmaması gerekir; herhangi biri cutoff'u aşıyorsa kayıt reddedilir.
  reject_if_any_field_after_cutoff: true

  # FAIL-CLOSED: zaman alanı eksik/ayrıştırılamıyor/belirsiz ise kayıt havuza
  # ALINMAZ. Elle istisna verilmez; istisna yalnızca kod değişikliğiyle olur.
  missing_or_unparsable: "reject"

  # Gelecek tarihli (cutoff sonrası) kayıtlar sessizce atılmaz; denetime yazılır.
  log_rejected_records: true
  rejected_records_dir: "data/pit/rejected"

  # Veri revizyonları: bir serinin cutoff anındaki ilk yayınlanmış hâli (vintage)
  # kullanılmalıdır. Vintage yoksa, revize edilmiş seri KULLANILMAZ.
  require_vintage_for_series_data: true
  vintage_policy: "first_release_at_or_before_cutoff"

  # Zaman çözünürlüğü belirsiz kayıtlar (ör. yalnızca yıl verilmiş) için:
  # en kötü durum varsayımı uygulanır (dönemin SONU kabul edilir).
  coarse_timestamp_policy: "assume_latest_possible"

# -----------------------------------------------------------------------------
# YOLLAR / VERİ BÖLGELERİ
# -----------------------------------------------------------------------------
paths:
  data_root: "data"
  raw_inbox: "data/raw"            # ham indirilen kaynaklar (değiştirilmez)
  pit_layer: "data/pit"            # zaman alanları doğrulanmış, filtrelenmiş katman
  answer_key: "data/answer_key"    # cutoff SONRASI gerçekleşmeler (erişilemez bölge)
  src: "src"
  tests: "tests"
  eval: "eval"
  docs: "docs"
  artifacts: "eval/runs"           # koşu bazlı çıktılar: <run_id>/ altında

# -----------------------------------------------------------------------------
# KAYNAK SEÇİMİ (MEKANİK KURAL)
# -----------------------------------------------------------------------------
source_selection:
  # Tek kural: cutoff'tan önce kamuya açılmış her şey alınır.
  rule: "published_at_or_before_cutoff"
  # Güncel LLM'lerin içerik seçmesi/elemesi/özetlemesi yasaktır.
  llm_may_select_sources: false
  llm_may_summarize_sources: false
  llm_may_rank_importance: false
  # Seçim kararı yalnızca bu programatik alanlara bakabilir.
  decision_fields_only:
    - "source_date"
    - "available_time"
    - "event_time"

# -----------------------------------------------------------------------------
# RETRIEVAL / KAPALI KAYNAK HAVUZU
# -----------------------------------------------------------------------------
retrieval:
  # Havuz kilitlidir: cutoff sonrası hiçbir içerik indekse giremez.
  locked: true
  index_dir: "data/pit/index"
  top_k: 12
  # Belge düzeyi zorunlu meta veri alanları (indeksleme reddi için kontrol edilir).
  required_document_metadata:
    - "doc_id"
    - "source_id"
    - "source_date"
    - "available_time"
    - "event_time"
    - "url_or_ref"
    - "content_hash"
  # Aynı içeriğin tekrarını engelle (tekrar = yapay önem şişmesi).
  deduplicate_by: "content_hash"

# -----------------------------------------------------------------------------
# TARİHSEL MODEL (chronologically isolated)
# -----------------------------------------------------------------------------
model:
  # Amaç: zamansal olarak izole edilmiş, HAZIR (sıfırdan eğitilmeyecek) model.
  # Aday aile: ChronoGPT / ChronoGPT-Instruct benzeri kronolojik modeller.
  # NOT: Bu aşamada hiçbir model indirilmez; yalnızca yapılandırma yeridir.
  family: "chrono-lm"           # placeholder
  model_id: null                # indirme/indeksleme aşamasında doldurulacak
  weights_dir: "models/"        # ileride: chrono-macro-lab içinde
  training_cutoff_must_be_lte_run_cutoff: true

  # Backtest sırasında dış dünya erişimi KAPALI.
  network_access: false
  allow_web_tools: false
  allow_external_api: false

  # Model yalnızca kapalı havuzdan gelen bağlamı görür.
  context_sources:
    - "retrieval"               # data/pit/index
  never_include_in_context:
    - "CONTEXT.md"              # geliştirici dokümanı
    - "docs/"                   # geliştirici dokümantasyonu
    - "data/answer_key/"        # cevap anahtarı
    - "eval/runs/"              # geçmiş koşu çıktıları

  # Determinizm: koşular karşılaştırılabilir olsun diye sabit tohum.
  decoding:
    temperature: 0.0
    top_p: 1.0
    seed: 20101231

# -----------------------------------------------------------------------------
# SIZINTI KORUMALARI (fail-closed)
# -----------------------------------------------------------------------------
leakage_guards:
  enabled: true
  # Kanarya belgeler: cutoff SONRASI tarihli, havuza ASLA girmemesi gereken
  # test belgeleri. Filtreden geçerlerse test kırmızıya döner.
  canary_documents: true
  canary_dir: "tests/fixtures/canary"
  # Cutoff'tan sonra yayınlanmış kaynakların oranı; 0 olmalıdır.
  max_post_cutoff_ratio: 0.0
  # Güncellenebilen kaynak türleri (ör. sürekli düzenlenen maddeler) varsayılan
  # olarak güvensiz sayılır; yalnızca tarihli sürüm (revision/vintage) ile kabul.
  mutable_sources_policy: "require_dated_revision"
  # Zaman alanlarından herhangi biri koşu penceresiyle tutarsızsa kayıt reddedilir.
  fail_closed: true

# -----------------------------------------------------------------------------
# DEĞERLENDİRME
# -----------------------------------------------------------------------------
evaluation:
  # Tahminler ölçülebilir, net çözülebilir sorulara dönüştürülür.
  question_types:
    - "binary"        # ör. "3 ay içinde faiz artırılır mı?"  (varsayımsal biçim)
    - "probability"   # 0..1 arası olasılık
    - "categorical"   # sınırlı seçenek kümesi
    - "numeric_band"  # aralık tahmini (ikincil)
  primary_metric: "brier_score"
  secondary_metrics:
    - "log_loss"
    - "calibration_curve"
    - "resolution"          # çözünürlük (Brier ayrıştırması)
  # Karşılaştırma tabanları (baseline) — model bunlardan anlamlı biçimde iyi olmalı.
  baselines:
    - "base_rate"           # geçmiş taban oran
    - "random_walk"         # naif rastgele yürüyüş varsayımı
    - "market_implied"      # cutoff anında erişilebilir piyasa ima olasılığı
  # Baseline'lar da YALNIZCA cutoff anında erişilebilir bilgiyle hesaplanır.
  baselines_point_in_time_only: true
  unresolved_questions: "report_separately"
  # Cevap anahtarına erişim yalnızca bu aşamada açılır.
  answer_key_access: "evaluation_only"

# -----------------------------------------------------------------------------
# LOGLAMA / İZLENEBİLİRLİK
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  json_lines: true
  # Her koşu, kullandığı config'in birebir kopyasını yanında taşır (yeniden üretilebilirlik).
  snapshot_config_per_run: true
  record_git_commit: true
